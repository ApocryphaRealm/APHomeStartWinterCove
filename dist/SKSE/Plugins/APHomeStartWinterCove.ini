; AP Home Start - Winter Cove
;
; An add-on for Alternate Perspective. Its menu's "My own Home" card gains Winter Cove beside the city houses: choose it, walk
; through the door, and the game begins inside it, already yours. No gold.
;
; This file is the only place these are set - the mod has no in-game menu page. Edit it with the game closed; it is read when
; the game starts.

[General]
; 1 runs the start, 0 leaves the option in Alternate Perspective's menu but makes choosing it do nothing.
bEnabled=1

; Seconds to wait after Alternate Perspective starts this mod's quest before acting. AP is still finishing its own hand-off
; at that moment. Waiting too long trips its safety net, which puts you in the Helgen Inn instead: raise it a little if you ever
; arrive back in the Resting Pilgrim, lower it if you ever land in Helgen.
fStartDelaySeconds=0.25

; How often to look to see whether you have finished arriving, before the key is handed over.
fStageGapSeconds=0.15

[Debug]
; How much detail reaches
; Documents\My Games\Skyrim Special Edition\SKSE\APHomeStartWinterCove.log
;   0 trace   1 debug   2 info (shipped default)   3 warning   4 error   5 critical   6 off
; For a bug report, set 0, reproduce, and send the log.
uLogLevel=2
